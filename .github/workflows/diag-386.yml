name: Diagnose 386 DNS

on:
  push:
    branches: [ ci/dit-check ]

permissions:
  contents: read

jobs:
  ubuntu-2404:
    name: Option 1 - upstream 386 job on ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arm64/dit
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build & test
        run: |
          uname -r; grep PRETTY /etc/os-release
          docker run --rm \
            --platform=linux/386 \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/src" \
            -w /src \
            debian:stable \
            bash -c "
              apt-get update > /dev/null &&
              apt-get install -y --no-install-recommends \
                build-essential cmake > /dev/null &&
              cmake -S . -B build > /dev/null &&
              cmake --build build > /dev/null &&
              ./build/mx25519-tests
            "

  host-m32:
    name: Option 2 - 386 build with -m32 on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arm64/dit
          persist-credentials: false

      - name: Install multilib
        run: |
          sudo apt-get update > /dev/null
          sudo apt-get install -y --no-install-recommends gcc-multilib > /dev/null
          gcc --version | head -1

      - name: Is 32-bit DNS broken on the host too?
        run: |
          printf '#include <netdb.h>\n#include <stdio.h>\nint main(void){struct addrinfo *r;int e=getaddrinfo("deb.debian.org","80",0,&r);printf("32-bit getaddrinfo: %%s\\n",e?gai_strerror(e):"ok");return 0;}\n' > dns.c
          gcc -m32 dns.c -o dns32 && file dns32 && ./dns32

      - name: Build & test (-m32)
        run: |
          cmake -S . -B build32 -DCMAKE_C_FLAGS=-m32 > /dev/null
          cmake --build build32 > /dev/null
          file build32/mx25519-tests
          ./build32/mx25519-tests
