name: Build & test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-native:
    name: Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build & test
        run: |
          cmake -S . -B build
          cmake --build build
          ./build/mx25519-tests
          nm build/libmx25519.a > symbols.txt
          grep 'T mx25519_scalarmult_amd64x' symbols.txt

      - name: Build & test (portable only)
        run: |
          cmake -S . -B build-portable -DMX25519_COPYLEFT=off
          cmake --build build-portable
          ./build-portable/mx25519-tests
          nm build-portable/libmx25519.a build-portable/libmx25519.so > symbols.txt
          if grep 'mx25519_scalarmult_amd64' symbols.txt; then exit 1; fi

      - name: Build (x32)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib
          cmake -S . -B build-x32 -DCMAKE_C_FLAGS=-mx32
          cmake --build build-x32
          nm build-x32/libmx25519.a > symbols.txt
          if grep 'mx25519_scalarmult_amd64' symbols.txt; then exit 1; fi

      - name: Backend selection (configure only)
        run: |
          check() {
            cmake -S . -B "build-sel-$1" -DCMAKE_C_COMPILER=clang -DCMAKE_C_COMPILER_TARGET="$1" \
              -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY > "build-sel-$1.log"
            grep -F "Assembly sources: $2" "build-sel-$1.log"
          }
          check x86_64-linux-gnu "AMD64 ON, ARM64 OFF"
          check aarch64-linux-gnu "AMD64 OFF, ARM64 ON"
          check aarch64_be-linux-gnu "AMD64 OFF, ARM64 OFF"
          check x86_64-linux-gnux32 "AMD64 OFF, ARM64 OFF"
          check arm64_32-apple-watchos "AMD64 OFF, ARM64 OFF"

      - name: Build & test (sanitizers)
        run: |
          cmake -S . -B build-san -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-san
          ./build-san/mx25519-tests

  linux-emulated:
    name: Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - 386
          - arm/v7
          - arm64
          - s390x

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build & test
        run: |
          docker run --rm \
            --platform=linux/${{ matrix.arch }} \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/src" \
            -w /src \
            debian:stable \
            bash -c "
              apt-get update &&
              apt-get install -y --no-install-recommends \
                build-essential cmake &&
              cmake -S . -B build &&
              cmake --build build &&
              ./build/mx25519-tests &&
              if [ ${{ matrix.arch }} = arm64 ]; then
                nm build/libmx25519.a | grep 'T mx25519_scalarmult_arm64'
              fi
            "

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build & test
        run: |
          cmake -S . -B build
          cmake --build build
          ./build/mx25519-tests
          nm build/libmx25519.a > symbols.txt
          if [ "$(uname -m)" = arm64 ]; then
            grep 'T _mx25519_scalarmult_arm64' symbols.txt
          else
            grep 'T _mx25519_scalarmult_amd64x' symbols.txt
          fi

      - name: Build & test (portable only)
        run: |
          cmake -S . -B build-portable -DMX25519_COPYLEFT=off
          cmake --build build-portable
          ./build-portable/mx25519-tests
          nm build-portable/libmx25519.a build-portable/libmx25519.dylib > symbols.txt
          if grep 'mx25519_scalarmult_arm64' symbols.txt; then exit 1; fi

      - name: Build & test (universal)
        run: |
          cmake -S . -B build-universal -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build-universal
          ./build-universal/mx25519-tests
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 ./build-universal/mx25519-tests
          fi
          nm -arch arm64 build-universal/mx25519-tests > symbols-arm64.txt
          nm -arch x86_64 build-universal/mx25519-tests > symbols-x86_64.txt
          grep '_mx25519_scalarmult_arm64' symbols-arm64.txt
          grep '_mx25519_scalarmult_amd64x' symbols-x86_64.txt

  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          .\build\Release\mx25519-tests.exe | Tee-Object -FilePath tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path tests.log -Pattern 'test_scmul_amd64 +\.\.\. PASSED' -Quiet)) { exit 1 }

  windows-gcc:
    name: Windows (GCC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles"

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: |
          .\build\mx25519-tests.exe | Tee-Object -FilePath tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path tests.log -Pattern 'test_scmul_amd64 +\.\.\. PASSED' -Quiet)) { exit 1 }
