name: README check

on:
  push:
    branches: [ ci/dit-check ]

permissions:
  contents: read

jobs:
  msvc:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "x64 host -> ARM64 (cl)", os: windows-latest, args: "-A ARM64", run: false }
          - { name: "x64 host -> ARM64 (cl, copyleft off)", os: windows-latest, args: "-A ARM64 -DMX25519_COPYLEFT=OFF", run: false }
          - { name: "ARM64 ClangCL", os: windows-11-arm, args: "-A ARM64 -T ClangCL", run: true }
          - { name: "ARM64 ClangCL (copyleft off)", os: windows-11-arm, args: "-A ARM64 -T ClangCL -DMX25519_COPYLEFT=OFF", run: true }
          - { name: "x64 (cl, copyleft off)", os: windows-latest, args: "-A x64 -DMX25519_COPYLEFT=OFF", run: true }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bcc564a5e1c2cde1b659b843ae1bfe695e663b61
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build ${{ matrix.args }}

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        if: ${{ matrix.run }}
        run: .\build\Release\mx25519-tests.exe
