name: README check

on:
  push:
    branches: [ ci/dit-check ]

permissions:
  contents: read

jobs:
  msvc:
    name: MSVC ${{ matrix.arch }} (copyleft ${{ matrix.copyleft }})
    runs-on: ${{ matrix.arch == 'ARM64' && 'windows-11-arm' || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [ ARM64, Win32 ]
        copyleft: [ ON, OFF ]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bcc564a5e1c2cde1b659b843ae1bfe695e663b61
          persist-credentials: false

      - name: Environment
        run: |
          cmake --version
          echo "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }} -DMX25519_COPYLEFT=${{ matrix.copyleft }}

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: .\build\Release\mx25519-tests.exe

  msvc-arm64-default:
    name: MSVC on windows-11-arm, default platform
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bcc564a5e1c2cde1b659b843ae1bfe695e663b61
          persist-credentials: false

      - name: Configure
        run: |
          cmake -S . -B build
          Select-String -Path build\CMakeCache.txt -Pattern '^CMAKE_GENERATOR_PLATFORM|^CMAKE_SYSTEM_PROCESSOR|^CMAKE_C_COMPILER:'

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: .\build\Release\mx25519-tests.exe
