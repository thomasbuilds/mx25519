name: DIT check

on:
  push:
    branches: [ ci/dit-check ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} (${{ matrix.tree }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-24.04-arm ]
        tree: [ master, fix ]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select tree
        run: |
          if [ "${{ matrix.tree }}" = master ]; then ref=bcc564a5e1c2cde1b659b843ae1bfe695e663b61; else ref=$(git rev-parse HEAD~1); fi
          git worktree add ../tree "$ref"
          git -C ../tree log -1 --format='tree under test: %H %s'
          cp .github/dit-check/dithar.c ../dithar.c

      - name: Machine
        run: |
          uname -a
          if [ "$(uname)" = Darwin ]; then
            sw_vers
            sysctl machdep.cpu.brand_string hw.ncpu hw.optional.arm.FEAT_DIT hw.optional.arm.FEAT_SB || true
          else
            lscpu | head -20
            grep -m1 -i '^features' /proc/cpuinfo
          fi
          cc --version | head -1

      - name: Tests (Release, Debug, portable only)
        working-directory: ../tree
        run: |
          for cfg in Release Debug; do
            cmake -S . -B build-$cfg -DCMAKE_BUILD_TYPE=$cfg > /dev/null
            cmake --build build-$cfg > /dev/null
            echo "== $cfg"
            ./build-$cfg/mx25519-tests | grep -E 'portable|arm64|successful'
          done
          cmake -S . -B build-nocl -DMX25519_COPYLEFT=off > /dev/null
          cmake --build build-nocl > /dev/null
          echo "== portable only"
          ./build-nocl/mx25519-tests | grep -E 'dit|successful'

      - name: Tests with clang
        if: runner.os == 'Linux'
        working-directory: ../tree
        run: |
          if ! command -v clang > /dev/null; then echo "clang not installed"; exit 0; fi
          clang --version | head -1
          cmake -S . -B build-clang -DCMAKE_C_COMPILER=clang > /dev/null
          cmake --build build-clang > /dev/null
          ./build-clang/mx25519-tests | grep -E 'dit|successful'

      - name: DIT during calls, and its cost
        working-directory: ../tree
        run: |
          extra=; [ "$(uname)" = Linux ] && extra=-no-pie
          cc -O2 $extra -I include ../dithar.c build-Release/libmx25519.a -o dithar
          OFFPC=1 ./dithar 3 15 2000 | tee dithar.txt
          if [ "$(uname)" = Linux ]; then
            grep offpc dithar.txt | awk '{print $2}' | sort | uniq -c | while read c a; do echo "  off sample: $c x $(addr2line -f -e dithar $a | head -1)"; done
          fi
          cc -O2 $extra -DNO_ARM64 -I include ../dithar.c build-nocl/libmx25519.a -o dithar-nocl
          ./dithar-nocl 3 0
