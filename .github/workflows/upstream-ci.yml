name: Upstream CI on arm64/dit

on:
  push:
    branches: [ ci/dit-check ]

permissions:
  contents: read

jobs:
  linux-native:
    name: Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arm64/dit

      - name: Build & test
        run: |
          cmake -S . -B build
          cmake --build build
          ./build/mx25519-tests

      - name: Build & test (portable only)
        run: |
          cmake -S . -B build-portable -DMX25519_COPYLEFT=off
          cmake --build build-portable
          ./build-portable/mx25519-tests
          nm build-portable/libmx25519.a build-portable/libmx25519.so > symbols.txt
          if grep 'mx25519_scalarmult_amd64' symbols.txt; then exit 1; fi

      - name: Build & test (sanitizers)
        run: |
          cmake -S . -B build-san -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build-san
          ./build-san/mx25519-tests

  linux-emulated:
    name: Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - 386
          - arm/v7
          - arm64
          - s390x

    steps:
      - uses: actions/checkout@v7
        with:
          ref: arm64/dit

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build & test
        run: |
          docker run --rm \
            --platform=linux/${{ matrix.arch }} \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/src" \
            -w /src \
            debian:stable \
            bash -c "
              apt-get update &&
              apt-get install -y --no-install-recommends \
                build-essential cmake &&
              cmake -S . -B build &&
              cmake --build build &&
              ./build/mx25519-tests &&
              if [ ${{ matrix.arch }} = arm64 ]; then
                QEMU_CPU=cortex-a53 ./build/mx25519-tests;
              fi
            "

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arm64/dit

      - name: Build & test
        run: |
          cmake -S . -B build
          cmake --build build
          ./build/mx25519-tests

      - name: Build & test (portable only)
        run: |
          cmake -S . -B build-portable -DMX25519_COPYLEFT=off
          cmake --build build-portable
          ./build-portable/mx25519-tests
          nm build-portable/libmx25519.a build-portable/libmx25519.dylib > symbols.txt
          if grep 'mx25519_scalarmult_arm64' symbols.txt; then exit 1; fi

  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arm64/dit

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: .\build\Release\mx25519-tests.exe

  windows-gcc:
    name: Windows (GCC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arm64/dit

      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles"

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: .\build\mx25519-tests.exe

  a53-catches-bad-detection:
    name: Control - detection forced on, Cortex-A53 must fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arm64/dit

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Mutant that always reports DIT
        run: |
          sed -i 's/getauxval(AT_HWCAP) & (1 << 24)/1/' src/cpu.c
          grep -n 'if (1)' src/cpu.c
          set +e
          docker run --rm \
            --platform=linux/arm64 \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/src" \
            -w /src \
            debian:stable \
            bash -c "
              apt-get update > /dev/null &&
              apt-get install -y --no-install-recommends build-essential cmake > /dev/null &&
              cmake -S . -B build > /dev/null &&
              cmake --build build > /dev/null &&
              ./build/mx25519-tests | tail -2 &&
              echo '--- same binary with QEMU_CPU=cortex-a53:' &&
              QEMU_CPU=cortex-a53 ./build/mx25519-tests
            "
          rc=$?
          echo "exit code: $rc"
          if [ $rc -eq 0 ]; then echo "mutant NOT caught"; exit 1; fi
          echo "mutant caught"
